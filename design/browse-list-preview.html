<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Index Browse List Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111111;
        color: #f4f4f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #111111;
      }

      .phone {
        position: relative;
        width: min(100%, 390px);
        height: 100vh;
        min-height: 100vh;
        margin: 0 auto;
        overflow: hidden;
        background: #171717;
      }

      .phone-scroll {
        height: 100%;
        overflow-y: auto;
        padding: 18px 14px 92px;
      }

      .topbar {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
      }

      .heading-line {
        display: flex;
        align-items: baseline;
        gap: 9px;
      }

      h1 {
        margin: 0;
        font-size: 25px;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .source {
        color: #9c9c9c;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .collection-control {
        position: absolute;
        z-index: 20;
        bottom: 14px;
        right: 14px;
        left: 14px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 3px;
        width: auto;
        padding: 5px;
        border-radius: 18px;
        background: #292929;
        corner-shape: squircle;
      }

      .tab {
        min-width: 0;
        border: 0;
        border-radius: 12px;
        padding: 10px 4px;
        color: #bcbcbc;
        background: transparent;
        font: inherit;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        corner-shape: squircle;
      }

      .tab[aria-selected="true"] {
        color: #171717;
        background: #f2f2f2;
      }

      .list {
        display: grid;
        gap: 9px;
      }

      .game-card {
        position: relative;
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 12px;
        min-height: 0;
        overflow: visible;
        isolation: isolate;
        border-radius: 15px;
        padding: 8px;
        background: #252525;
        corner-shape: squircle;
        align-items: stretch;
      }

      .game-card::before {
        position: absolute;
        z-index: -2;
        inset: 0;
        content: "";
        background-image: var(--art);
        background-position: center;
        background-size: cover;
        filter: saturate(0.55);
        opacity: 0.12;
        border-radius: 15px;
      }

      .game-card::after {
        position: absolute;
        z-index: -1;
        inset: 0;
        content: "";
        background: rgba(19, 19, 19, 0.73);
      }

      .cover {
        width: 76px;
        height: auto;
        min-height: 104px;
        align-self: stretch;
        border-radius: 9px;
        object-fit: cover;
        background: #333333;
      }

      .copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
        padding-top: 1px;
      }

      .top-copy {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .title {
        overflow: hidden;
        margin: 0;
        font-size: 15px;
        font-weight: 750;
        line-height: 1.2;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .title-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .subtitle,
      .metric {
        margin: 0;
        color: #c0c0c0;
        font-size: 12px;
        line-height: 1.2;
      }

      .subtitle {
        margin-top: 3px;
      }

      .metric {
        color: #eeeeee;
        font-variant-numeric: tabular-nums;
      }

      .metric-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 8px;
      }

      .stat {
        display: flex;
        flex-direction: column;
        gap: 0;
        min-width: 0;
      }

      .stat-label {
        color: #a7a7a7;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1;
        text-transform: uppercase;
      }

      .stat-value {
        overflow: hidden;
        color: #eeeeee;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rank {
        flex: 0 0 auto;
        color: #eeeeee;
        font-size: 10px;
        font-weight: 800;
        line-height: 1.15;
      }

      .empty {
        display: none;
        padding: 34px 16px;
        border: 1px dashed #3b3b3b;
        border-radius: 15px;
        color: #a7a7a7;
        text-align: center;
        font-size: 13px;
      }

      @media (min-width: 600px) {
        body {
          padding: 32px 0;
          background: #0d0d0d;
        }

        .phone {
          height: 780px;
          min-height: 780px;
          border: 1px solid #303030;
          border-radius: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <div class="phone-scroll">
        <header class="topbar">
        <div class="heading-line">
          <h1>Browse</h1>
          <span class="source">Steam data</span>
        </div>
        </header>

      <section class="list" data-list="most-played" aria-live="polite">
        <article class="game-card" style="--art: url('https://images.igdb.com/igdb/image/upload/t_cover_big/co1r7h.jpg')">
          <img class="cover" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co1r7h.jpg" alt="Counter-Strike 2 cover" />
          <div class="copy">
            <div class="top-copy"><div class="title-row"><h2 class="title">Counter-Strike 2</h2><span class="rank">#1</span></div><p class="subtitle">Multiplayer shooter</p></div>
            <div class="metric-row"><div class="stat"><span class="stat-label">Playing now</span><strong class="stat-value">570,355</strong></div><div class="stat"><span class="stat-label">Peak today</span><strong class="stat-value">1,347,575</strong></div></div>
          </div>
        </article>
        <article class="game-card" style="--art: url('https://images.igdb.com/igdb/image/upload/t_cover_big/co20n0.jpg')">
          <img class="cover" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co20n0.jpg" alt="Dota 2 cover" />
          <div class="copy">
            <div class="top-copy"><div class="title-row"><h2 class="title">Dota 2</h2><span class="rank">#2</span></div><p class="subtitle">Strategy</p></div>
            <div class="metric-row"><div class="stat"><span class="stat-label">Playing now</span><strong class="stat-value">364,074</strong></div><div class="stat"><span class="stat-label">Peak today</span><strong class="stat-value">816,040</strong></div></div>
          </div>
        </article>
        <article class="game-card" style="--art: url('https://images.igdb.com/igdb/image/upload/t_cover_big/co49wj.jpg')">
          <img class="cover" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co49wj.jpg" alt="PUBG Battlegrounds cover" />
          <div class="copy">
            <div class="top-copy"><div class="title-row"><h2 class="title">PUBG: Battlegrounds</h2><span class="rank">#3</span></div><p class="subtitle">Battle royale</p></div>
            <div class="metric-row"><div class="stat"><span class="stat-label">Playing now</span><strong class="stat-value">171,772</strong></div><div class="stat"><span class="stat-label">Peak today</span><strong class="stat-value">776,812</strong></div></div>
          </div>
        </article>
      </section>

        <p class="empty">No games are available in this collection yet.</p>
      </div>

      <nav class="collection-control" aria-label="Browse collections">
        <button class="tab" aria-selected="true" data-collection="most-played">Played</button>
        <button class="tab" aria-selected="false" data-collection="popular">Popular</button>
        <button class="tab" aria-selected="false" data-collection="hot">Hot</button>
        <button class="tab" aria-selected="false" data-collection="trending">Trending</button>
      </nav>
    </main>

    <script>
      const tabs = document.querySelectorAll(".tab");
      const list = document.querySelector(".list");
      const empty = document.querySelector(".empty");

      const collections = {
        "most-played": [
          ["Counter-Strike 2", "Steam · Multiplayer shooter", "570,355", "Playing now", "1,347,575", "Peak today", "co1r7h.jpg"],
          ["Dota 2", "Steam · Strategy", "364,074", "Playing now", "816,040", "Peak today", "co20n0.jpg"],
          ["PUBG: Battlegrounds", "Steam · Battle royale", "171,772", "Playing now", "776,812", "Peak today", "co49wj.jpg"],
          ["Marvel Rivals", "Steam · Hero shooter", "132,188", "Playing now", "150,745", "Peak today", "co9w2l.jpg"],
          ["EA Sports FC 26", "Steam · Sports", "86,642", "Playing now", "149,218", "Peak today", "co8lsq.jpg"],
          ["Warframe", "Steam · Action", "66,764", "Playing now", "94,030", "Peak today", "co7u5x.jpg"],
          ["Apex Legends", "Steam · Battle royale", "66,161", "Playing now", "202,401", "Peak today", "co49wj.jpg"],
          ["Dead by Daylight", "Steam · Horror", "66,010", "Playing now", "102,315", "Peak today", "co20n0.jpg"],
          ["Rust", "Steam · Survival", "67,304", "Playing now", "136,889", "Peak today", "co1r7h.jpg"],
          ["The Binding of Isaac: Rebirth", "Steam · Action roguelike", "80,822", "Playing now", "144,548", "Peak today", "co8lsq.jpg"],
          ["Mecha Chameleon", "Steam · Action", "68,528", "Playing now", "113,197", "Peak today", "co7u5x.jpg"],
          ["Team Fortress 2", "Steam · Multiplayer shooter", "54,203", "Playing now", "92,640", "Peak today", "co9w2l.jpg"],
          ["Grand Theft Auto V", "Steam · Action", "51,774", "Playing now", "174,231", "Peak today", "co49wj.jpg"],
          ["Baldur's Gate 3", "Steam · Role-playing", "49,412", "Playing now", "116,842", "Peak today", "co20n0.jpg"],
          ["Stardew Valley", "Steam · Simulation", "43,906", "Playing now", "71,233", "Peak today", "co1r7h.jpg"],
          ["Terraria", "Steam · Adventure", "42,785", "Playing now", "91,027", "Peak today", "co8lsq.jpg"],
          ["Helldivers 2", "Steam · Action", "39,608", "Playing now", "68,527", "Peak today", "co7u5x.jpg"],
          ["Path of Exile 2", "Steam · Role-playing", "36,991", "Playing now", "74,300", "Peak today", "co9w2l.jpg"],
          ["Monster Hunter Wilds", "Steam · Action", "34,514", "Playing now", "88,610", "Peak today", "co49wj.jpg"],
          ["Cyberpunk 2077", "Steam · Role-playing", "31,208", "Playing now", "63,992", "Peak today", "co20n0.jpg"],
        ],
        popular: [
          ["Palworld", "Steam · Survival adventure", "20,29 €", "Price", "—", "Peak today", "co8lsq.jpg"],
          ["Assassin's Creed Black Flag Resynced", "Steam · Action adventure", "59,99 €", "Price", "104,604", "Peak today", "co7u5x.jpg"],
          ["Echoes of Aincrad", "Steam · Role-playing", "69,99 €", "Price", "17,312", "Peak today", "co9w2l.jpg"],
          ["EA Sports College Football 27", "Steam · Sports", "69,99 €", "Price", "11,469", "Peak today", "co49wj.jpg"],
          ["Moonlight Peaks", "Steam · Simulation", "29,74 €", "Price", "8,551", "Peak today", "co20n0.jpg"],
          ["Esports Manager 2026", "Steam · Management", "15,19 €", "Price", "8,805", "Peak today", "co1r7h.jpg"],
        ],
        hot: [
          ["Backyard Baseball", "Steam · Sports", "38,99 €", "Price", "Today", "Release", "co9qjy.jpg"],
          ["Angels Fall First", "Steam · First-person shooter", "16,19 €", "Price", "This week", "Release", "co20n0.jpg"],
          ["Master Healer Kale", "Steam · Role-playing", "4,15 €", "Price", "This week", "Release", "co49wj.jpg"],
          ["Forest Escape: Last Train", "Steam · Adventure", "7,99 €", "Price", "This week", "Release", "co7u5x.jpg"],
          ["Veritas Tales", "Steam · Role-playing", "—", "Price", "Coming soon", "Release", "co8lsq.jpg"],
          ["Alek", "Steam · Adventure", "15,29 €", "Price", "This week", "Release", "co9w2l.jpg"],
        ],
        trending: [
          ["Marvel Rivals", "Steam · Hero shooter", "132,188", "Playing now", "Global seller", "Trend", "co9w2l.jpg"],
          ["EA Sports FC 26", "Steam · Sports", "86,642", "Playing now", "Global seller", "Trend", "co8lsq.jpg"],
          ["Warframe", "Steam · Action", "66,764", "Playing now", "Global seller", "Trend", "co7u5x.jpg"],
          ["Apex Legends", "Steam · Battle royale", "66,161", "Playing now", "Global seller", "Trend", "co49wj.jpg"],
          ["Dead by Daylight", "Steam · Horror", "66,010", "Playing now", "Global seller", "Trend", "co20n0.jpg"],
          ["Rust", "Steam · Survival", "67,304", "Playing now", "Global seller", "Trend", "co1r7h.jpg"],
        ],
      };

      function renderCollection(collection) {
        const games = collections[collection] ?? collections["most-played"];
        list.innerHTML = games
          .map(
            ([title, subtitle, primary, primaryLabel, secondary, secondaryLabel], index) => `
              <article class="game-card" style="--art: url('https://images.igdb.com/igdb/image/upload/t_cover_big/co1r7h.jpg')">
                <img class="cover" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co1r7h.jpg" alt="${title} cover" />
                <div class="copy">
                  <div class="top-copy"><div class="title-row"><h2 class="title">${title}</h2><span class="rank">#${index + 1}</span></div><p class="subtitle">${subtitle.replace(/^Steam · /, "")}</p></div>
                  <div class="metric-row"><div class="stat"><span class="stat-label">${primaryLabel}</span><strong class="stat-value">${primary}</strong></div><div class="stat"><span class="stat-label">${secondaryLabel}</span><strong class="stat-value">${secondary}</strong></div></div>
                </div>
              </article>
            `,
          )
          .join("");
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((item) => item.setAttribute("aria-selected", String(item === tab)));
          list.dataset.list = tab.dataset.collection;
          empty.style.display = "none";
          list.style.display = "grid";
          renderCollection(tab.dataset.collection);
        });
      });

      renderCollection("most-played");
    </script>
  </body>
</html>
