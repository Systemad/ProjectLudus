services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  prefect-server:
    image: "prefecthq/prefect:3-python3.13"
    command:
      - "prefect"
      - "server"
      - "start"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/prefect"
      PREFECT_API_URL: "${PREFECT_API_URL}"
      PREFECT_UI_URL: "${PREFECT_UI_URL}"
    ports:
      - "4200:4200"
    networks:
      - "aspire"
      - "dokploy-network"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  pipeline-worker:
    image: "prefecthq/prefect:3-python3.13"
    command:
      - "prefect"
      - "worker"
      - "start"
      - "--pool"
      - "pipeline-pool"
      - "--type"
      - "docker"
    restart: always

    volumes:
      - type: "bind"
        target: "/var/run/docker.sock"
        source: "/var/run/docker.sock"
        read_only: false
      - type: "volume"
        target: "/data/dlt"
        source: "dlt-data"
        read_only: false
      - /root/.docker/config.json:/root/.docker/config.json:ro
    depends_on:
      prefect-server:
        condition: "service_healthy"
    networks:
      - "aspire"
      - "dokploy-network"
networks:
  aspire:
    driver: "bridge"
  dokploy-network:
    external: true
volumes:
  dlt-data:
    driver: "local"
