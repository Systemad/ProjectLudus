services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  igdb-webhook:
    image: "${IGDB_WEBHOOK_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${IGDB_WEBHOOK_PORT}"
      ConnectionStrings__catalogdb: "Host=${PG_HOST};Port=${PG_PORT};Username=${PG_USER};Password=${PG_PASSWORD};Database=${PG_DATABASE}"
      IGDB__CLIENT_ID: "${IGDB_CLIENT_ID}"
      IGDB__ACCESS_TOKEN: "${IGDB_ACCESS_TOKEN}"
      IGDB__WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
      IGDB__WEBHOOK_URL: "${WEBHOOK_URL}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "igdb-webhook"
    expose:
      - "${IGDB_WEBHOOK_PORT}"
      - "8000"
    networks:
      - "aspire"
  prefect-server:
    image: "prefecthq/prefect:3-python3.13"
    command:
      - "prefect"
      - "server"
      - "start"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/prefect"
      PREFECT_API_URL: "${PREFECT_API_URL}"
      PREFECT_UI_URL: "${PREFECT_UI_URL}"
    ports:
      - "4200:4200"
    networks:
      - "aspire"
      - "dokploy-network"
  pipeline-worker:
    image: "prefecthq/prefect:3-python3.13"
    command:
      - "sh"
      - "-c"
      - "pip install --no-cache-dir prefect-docker && prefect worker start --pool pipeline-pool --type docker"
    environment:
      PREFECT_API_URL: "${PREFECT_API_URL}"
      PREFECT_UI_URL: "${PREFECT_UI_URL}"
    volumes:
      - type: "bind"
        target: "/var/run/docker.sock"
        source: "/var/run/docker.sock"
        read_only: false
      - type: "bind"
        target: "/root/.docker/config.json"
        source: "${PIPELINE_WORKER_BINDMOUNT_0}"
        read_only: false
      - type: "volume"
        target: "/data/dlt"
        source: "dlt-data"
        read_only: false
    depends_on:
      prefect-server:
        condition: "service_healthy"
    networks:
      - "aspire"
      - "dokploy-network"
    restart: "always"
networks:
  aspire:
    driver: "bridge"
  dokploy-network:
    external: true
volumes:
  dlt-data:
    driver: "local"
