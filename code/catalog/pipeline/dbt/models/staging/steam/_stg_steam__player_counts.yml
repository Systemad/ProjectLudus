version: 2

models:
  - name: stg_steam__player_counts
    config:
      contract:
        enforced: true
      on_schema_change: append_new_columns
    columns:
      - name: game_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: steam_app_id
        data_type: bigint
      - name: current_players
        data_type: bigint
      - name: captured_at
        data_type: timestamp with time zone
      - name: peak_24h
        data_type: bigint
      - name: sparkline_7d
        data_type: int[]
