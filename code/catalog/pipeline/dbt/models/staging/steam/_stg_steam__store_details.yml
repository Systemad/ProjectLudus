version: 2

models:
  - name: stg_steam__store_details
    config:
      contract:
        enforced: true
      on_schema_change: append_new_columns
    columns:
      - name: game_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: steam_app_id
        data_type: bigint
      - name: header_url
        data_type: text
      - name: capsule_url
        data_type: text
