version: 2
models:
  - name: bridge_platform_version_release_date

    config:
      contract: { enforced: true }
      alias: "platform_version_release_date"
    constraints:
      - type: primary_key
        columns: [release_date, platform_version]

      - type: foreign_key
        columns: [release_date]
        to: ref('mart_platform_version_release_dates')
        to_columns: [id]

      - type: foreign_key
        columns: [platform_version]
        to: ref('mart_platform_versions')
        to_columns: [id]

    description: "Bridge table linking platform_versions to their release dates."
    columns:
      - name: release_date
        data_type: bigint
        description: "FK to mart_platform_version_release_dates.id."
        tests:
          - not_null
      - name: platform_version
        data_type: bigint
        description: "FK to mart_platform_versions.id."
        tests:
          - not_null