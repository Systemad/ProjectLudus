version: 2
models:
  - name: bridge_company_type_history
    config:
      contract: { enforced: true }
    constraints:
      - type: foreign_key
        columns: [company_id]
        to: ref('mart_companies')
        to_columns: [id]
      - type: foreign_key
        columns: [company_type_id]
        to: ref('mart_company_types')
        to_columns: [id]
    columns:
      - name: company_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: company_type_id
        data_type: bigint
        constraints:
          - type: not_null
