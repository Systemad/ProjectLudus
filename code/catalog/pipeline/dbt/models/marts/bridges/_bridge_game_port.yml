version: 2

models:
  - name: bridge_game_port
    config:
      contract: { enforced: true }
      alias: "game_port"
    description: "Join table linking games to their ports."
    constraints:
      - type: primary_key
        columns: [port_id]
      - type: foreign_key
        columns: [port_id]
        to: ref('mart_games')
        to_columns: [id]
    columns:
      - name: port_source_id
        data_type: bigint
      - name: port_id
        data_type: bigint
