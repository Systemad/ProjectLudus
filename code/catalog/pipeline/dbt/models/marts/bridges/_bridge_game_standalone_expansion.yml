version: 2

models:
  - name: bridge_game_standalone_expansion
    config:
      contract: { enforced: true }
      alias: "game_standalone_expansion"
    description: "Join table linking games to their standalone expansions."
    constraints:
      - type: primary_key
        columns: [standalone_expansion_source_id, standalone_expansion_id]
      - type: foreign_key
        columns: [standalone_expansion_source_id]
        to: ref('mart_games')
        to_columns: [id]
      - type: foreign_key
        columns: [standalone_expansion_id]
        to: ref('mart_games')
        to_columns: [id]
    columns:
      - name: standalone_expansion_source_id
        data_type: bigint
      - name: standalone_expansion_id
        data_type: bigint
