version: 2
models:
    - name: mart_company_logos

      config:
          alias: company_logos
          contract: { enforced: true }

      constraints:
          - type: primary_key
            columns: [id]

          #- type: foreign_key
          #  columns: [company_id]
          #  to: ref('mart_companies')
          #  to_columns: [id]
          #  on_delete: cascade

      description: ""
      columns:
          - name: id
            data_type: bigint
            constraints:
                - type: not_null
            description: ""
          - name: company_id
            data_type: bigint
            description: ""
          - name: alpha_channel
            data_type: boolean
            description: ""
          - name: animated
            data_type: boolean
            description: ""
          - name: height
            data_type: bigint
            description: ""
          - name: image_id
            data_type: character varying
            description: ""
          - name: url
            data_type: character varying
            constraints:
              - type: not_null
            description: ""
          - name: width
            data_type: bigint
            description: ""
          - name: checksum
            data_type: character varying
            constraints:
              - type: not_null
            description: ""
