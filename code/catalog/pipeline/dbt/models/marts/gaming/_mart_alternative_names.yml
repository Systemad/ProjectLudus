version: 2
models:
    - name: mart_alternative_names

      config:
          alias: alternative_names
          contract: { enforced: true }

      constraints:
          - type: primary_key
            columns: [id]

          - type: foreign_key
            columns: [game]
            to: ref('mart_games')
            to_columns: [id]
            on_delete: cascade

      description: ""
      columns:
          - name: id
            data_type: bigint
            description: ""
          - name: comment
            data_type: character varying
            description: ""
          - name: game
            data_type: bigint
            description: ""
          - name: name
            data_type: character varying
            constraints:
              - type: not_null
            description: ""
          - name: checksum
            data_type: character varying
            constraints:
              - type: not_null
            description: ""
