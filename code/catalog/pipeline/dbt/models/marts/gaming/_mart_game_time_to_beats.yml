version: 2
models:
  - name: mart_game_time_to_beats
    config:
      enabled: true
      alias: game_time_to_beats
      contract: { enforced: true }
    description: "Time-to-beats metrics for a game — how long to finish (hastily, normally, completely)."
    constraints:
      - type: primary_key
        columns: [id]
      - type: foreign_key
        columns: [game_id]
        to: ref('mart_games')
        to_columns: [id]
        on_delete: cascade
    columns:
      - name: id
        data_type: bigint
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: created_at
        data_type: bigint
        constraints:
          - type: not_null
        description: ""
      - name: updated_at
        data_type: bigint
        constraints:
          - type: not_null
        description: ""
      - name: game_id
        data_type: bigint
        description: "FK to mart_games.id — the game this time-to-beat record belongs to."
        data_tests: [not_null]
      - name: hastily
        data_type: bigint
        description: "Time to beat (rushing) in minutes."
      - name: normally
        data_type: bigint
        description: "Time to beat (average) in minutes."
      - name: completely
        data_type: bigint
        description: "Time to beat (100% completion) in minutes."
      - name: count
        data_type: bigint
        description: "Number of submissions."
      - name: checksum
        data_type: character varying
        constraints:
          - type: not_null
        description: ""
