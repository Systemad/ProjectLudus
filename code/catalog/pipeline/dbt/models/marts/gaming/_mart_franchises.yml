      - name: id
        data_type: bigint
        description: ""
      - name: created_at
        data_type: bigint
        constraints:
          - type: not_null
        description: ""
      - name: updated_at
        data_type: bigint
        constraints:
          - type: not_null
        description: ""
      - name: name
        data_type: character varying
        constraints:
          - type: not_null
        description: ""
      - name: slug
        data_type: character varying
        constraints:
          - type: not_null
        description: ""
      - name: url
        data_type: character varying
        constraints:
          - type: not_null
        description: ""
      - name: checksum
        data_type: character varying
        constraints:
          - type: not_null
        description: ""
