version: 2
models:
  - name: mart_collection_membership_types
    config:
      enabled: true
      alias: collection_membership_types
      contract: { enforced: true }
    description: "Lookup table for collection membership types."
    constraints:
      - type: primary_key
        columns: [id]
      - type: foreign_key
        columns: [allowed_collection_type]
        to: ref('mart_collection_types')
        to_columns: [id]
    columns:
      - name: id
        data_type: bigint
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: name
        data_type: character varying
        constraints:
          - type: not_null
        description: "Type name."
      - name: description
        data_type: character varying
        description: "Type description."
      - name: allowed_collection_type
        data_type: bigint
        description: "FK to mart_collection_types.id."
      - name: created_at
        data_type: bigint
        constraints:
          - type: not_null
        description: ""
      - name: updated_at
        data_type: bigint
        constraints:
          - type: not_null
        description: ""
      - name: checksum
        data_type: character varying
        constraints:
          - type: not_null
        description: ""
