version: 2
models:
    - name: mart_platform_logos

      config:
          alias: platform_logos
          contract: { enforced: true }

      constraints:
          - type: primary_key
            columns: [id]

      description: ""
      columns:
          - name: id
            data_type: bigint
            constraints:
                - type: not_null
            description: ""
          - name: platform_id
            data_type: bigint
            constraints:
              - type: not_null
            description: ""
          - name: alpha_channel
            data_type: boolean
            description: ""
          - name: animated
            data_type: boolean
            description: ""
          - name: height
            data_type: bigint
            description: ""
          - name: image_id
            data_type: character varying
            description: ""
          - name: url
            data_type: character varying
            constraints:
              - type: not_null
            description: ""
          - name: width
            data_type: bigint
            description: ""
          - name: checksum
            data_type: character varying
            constraints:
              - type: not_null
            description: ""
